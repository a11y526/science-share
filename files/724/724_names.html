let dirty=false;const cards=[];
const IMG={};['sun','corona','moon'].forEach(k=>{const im=new Image();im.onload=()=>{cards.forEach(c=>c.draw());};im.src=A[k]||'';IMG[k]=im;});
const ok=im=>im&&im.complete&&im.naturalWidth>0;
function fit(cv){const d=Math.min(2,devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d);}
  const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);return [x,w,h];}
function stars(x,w,h,n,seed,a){let s=seed;const r=()=>(s=(s*16807)%2147483647)/2147483647;x.fillStyle='#fff';
  for(let i=0;i<n;i++){x.globalAlpha=(.25+.6*r())*(a==null?1:a);x.beginPath();x.arc(r()*w,r()*h,r()*1.3+.3,0,7);x.fill();}x.globalAlpha=1;}
function txt(x,t,X,Y,o){o=o||{};x.font=(o.w||700)+' '+(o.s||14)+"px 'Noto Sans KR',sans-serif";x.textAlign=o.al||'center';x.textBaseline='middle';
  if(o.halo){x.lineWidth=o.halo*2;x.strokeStyle='rgba(5,7,15,.85)';x.lineJoin='round';x.strokeText(t,X,Y);}x.fillStyle=o.c||'#fff';x.fillText(t,X,Y);}
/* 코로나 사진: 네모 가장자리가 보이지 않게 둥글게 흐려 둔 사본 */
let CORO=null;
function corona(){if(CORO)return CORO;const n=IMG.corona.naturalWidth,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');
  x.drawImage(IMG.corona,0,0);x.globalCompositeOperation='destination-in';const g=x.createRadialGradient(n/2,n/2,n*.3,n/2,n/2,n/2);
  g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.55,'rgba(0,0,0,.75)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,n,n);return CORO=c;}
/* 망원 창의 태양: 실제 태양 사진(필터 너머) 위로 달 원판이 오른쪽에서 들어온다. end = 멈출 때 달 중심이 태양 중심에서 떨어진 거리(R 단위) */
function drawSolar(x,cx,cy,R,t,end){
  const mx=cx+R*lerp(2.4,end,ease(clamp(t))),rm=R*1.03;
  if(ok(IMG.sun))x.drawImage(IMG.sun,cx-R,cy-R,2*R,2*R);else{x.fillStyle='#F39A1E';x.beginPath();x.arc(cx,cy,R,0,7);x.fill();}
  x.fillStyle='#07080C';x.beginPath();x.arc(mx,cy,rm,0,7);x.fill();
  const tot=end<.05?clamp((t-.86)/.14):0;
  if(tot>0&&ok(IMG.corona)){const S=R/.286;x.globalAlpha=ease(tot);x.globalCompositeOperation='screen';x.drawImage(corona(),cx-S/2,cy-S/2,S,S);x.globalCompositeOperation='source-over';x.globalAlpha=1;x.fillStyle='#07080C';x.beginPath();x.arc(cx,cy,R*1.0,0,7);x.fill();}
  return tot;}
/* 망원 창의 달: 지구의 그림자가 왼쪽에서 덮어 오며 그림자 속은 어두운 붉은색 */
function drawLunar(x,cx,cy,R,t,end){
  const Ru=R*1.35,sx=cx-R*lerp(Ru/R+1.25,end==null?0:end,ease(clamp(t)));
  x.save();x.beginPath();x.arc(cx,cy,R,0,7);x.clip();
  if(ok(IMG.moon))x.drawImage(IMG.moon,cx-R*1.02,cy-R*1.02,R*2.04,R*2.04);else{x.fillStyle='#BDBDBD';x.fillRect(cx-R,cy-R,2*R,2*R);}
  x.globalCompositeOperation='multiply';
  const g=x.createRadialGradient(sx,cy,0,sx,cy,Ru+R*.7);
  g.addColorStop(0,'#7A2A14');g.addColorStop((Ru-R*.05)/(Ru+R*.7),'#7A2A14');g.addColorStop((Ru+R*.08)/(Ru+R*.7),'#C9C2BC');g.addColorStop(1,'#FFFFFF');
  x.fillStyle=g;x.fillRect(cx-R,cy-R,2*R,2*R);x.restore();}


function anim(cv){
  const mode=cv.dataset.anim;let t0=0,t=RM?1:0,raf=0,timer=0;
  function draw(){const [x,w,h]=fit(cv);x.fillStyle='#05070F';x.fillRect(0,0,w,h);stars(x,w,h,40,mode.length*97,.6);
    const R=Math.min(w,h)*.3,cx=w/2,cy=h/2;
    if(mode==='lunar')drawLunar(x,cx,cy,R,t);else drawSolar(x,cx,cy,R,t,mode==='partial'?.95:0);}
  function step(now){if(!t0)t0=now;t=clamp((now-t0)/2600);draw();if(t<1)raf=requestAnimationFrame(step);else timer=setTimeout(play,2500);}
  function play(){clearTimeout(timer);if(RM){t=1;draw();return;}cancelAnimationFrame(raf);t0=0;t=0;raf=requestAnimationFrame(step);}
  return {draw,play};
}
const SETS={5:[['solar','일식 · 태양이 가려져요'],['lunar','월식 · 달이 가려져요']],8:[['total','개기일식 · 모두 가려져요'],['partial','부분일식 · 일부만 가려져요']]};
const m=/ws=(\d+)/.exec(decodeURIComponent(location.hash||''));
const set=SETS[m?m[1]:5]||SETS[5];
set.forEach(([mode,cap])=>{const d=document.createElement('div');d.className='card';d.innerHTML='<canvas data-anim="'+mode+'"></canvas><div class="cap"></div>';
  d.querySelector('.cap').textContent=cap;document.getElementById('row').appendChild(d);
  const a=anim(d.querySelector('canvas'));cards.push(a);d.onclick=()=>a.play();});
addEventListener('resize',()=>cards.forEach(c=>c.draw()));
cards.forEach(c=>c.draw());
new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){cards.forEach(c=>c.play());}}),{threshold:.3}).observe(document.getElementById('row'));
})();
