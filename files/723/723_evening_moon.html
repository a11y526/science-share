.sub button:hover{background:#2B2B2B}

.stage.gohere{border-radius:20px}

  button{min-height:36px;font-size:14.5px}
}
@media (max-width:600px){
  body{overflow:auto;height:auto;min-height:100%}
  .row{flex-direction:column}.stage{flex:none;height:64vh;min-height:320px}
  #qs{flex:none;overflow:visible}
}
@media (prefers-reduced-motion:reduce){.q.nudge,.how span.flash,.gohere{animation:none}}
</style>

    var px=Math.min(s.width-1,Math.floor((lon/Math.PI+.5)*s.width)),py=Math.min(s.height-1,Math.floor((.5-lat/Math.PI)*s.height)),q=(py*s.width+px)*4;
    var a=Math.min(1,(1-Math.sqrt(rr))*N*.5),lim=1.25*(.82+.18*Math.sqrt(1-rr));
    o.data[k]=Math.min(255,S[q]*lim);o.data[k+1]=Math.min(255,S[q+1]*lim);o.data[k+2]=Math.min(255,S[q+2]*lim);o.data[k+3]=255*a;}
  x.clearRect(0,0,N,N);x.putImageData(o,0,0);if(window.Q)Q.redraw();}catch(e){}};im.src=window.MOON_NEAR;}
function draw(x,cx,cy,r,e,o){o=o||{};e=((e%360)+360)%360;var k=Math.cos(e*Math.PI/180),wax=e<=180,H=Math.PI/2;
  x.save();x.translate(cx,cy);if(o.rot)x.rotate(o.rot);
  x.beginPath();x.arc(0,0,r,0,7);x.fillStyle=o.darkCol||'#10131F';x.fill();
  x.globalAlpha=o.dark==null?.13:o.dark;x.drawImage(disc,-r,-r,r*2,r*2);x.globalAlpha=1;
  if(e>.8&&e<359.2){x.beginPath();x.arc(0,0,r,-H,H,!wax);
    x.ellipse(0,0,Math.max(.01,r*Math.abs(k)),r,0,H,wax===(k>0)?-H:3*H,wax===(k>0));x.closePath();x.clip();
    x.drawImage(disc,-r,-r,r*2,r*2);}
  x.restore();
  if(o.ring){x.strokeStyle=o.ring;x.lineWidth=o.rw||1.5;x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();}}
/* 우주에서 내려다본 달: 태양 쪽(sunAng 방향) 절반이 항상 밝다 */
function top(x,cx,cy,r,sunAng){x.save();x.translate(cx,cy);x.rotate(sunAng||0);
  x.beginPath();x.arc(0,0,r,0,7);x.fillStyle='#262A38';x.fill();
  x.beginPath();x.arc(0,0,r,-Math.PI/2,Math.PI/2);x.closePath();x.fillStyle='#EDEBE4';x.fill();
  x.restore();}
function name(e){e=((e%360)+360)%360;return e<10||e>350?'삭':e<80?'초승달':e<=100?'상현달':e<170?'상현달과 보름달 사이':e<=190?'망(보름달)':e<260?'보름달과 하현달 사이':e<=280?'하현달':'그믐달';}
return {draw:draw,top:top,name:name,disc:disc};
})();
</script>
</head>
<body>
<p class="how" id="how"></p>
<div class="row">
  <div class="stage">
    <div class="cvbox"><canvas id="cv"></canvas></div>
    <div class="ctrl"><span>음력 날짜</span><button type="button" class="arw" id="bp" aria-label="앞 날짜">◀</button><input id="rg" type="range" min="0" max="7" step="1" value="0"><button type="button" class="arw" id="bn" aria-label="다음 날짜">▶</button><output id="ov"></output></div>
  </div>
  <aside id="qs"></aside>
</div>
<script>
(function(){
'use strict';
const H=Q.how(['① 1번에서 <b>떠오르는 달의 모양</b> 고르기','② <b>날짜 막대</b>를 음력 15일경까지 끝까지 옮기기','③ 2·3번을 <b>골라 [제출]</b>']);
const L='② 날짜 막대를 음력 15일경까지 옮겨 보세요',qd=window.QD[2];qd[1].lock=L;qd[2].lock=L;
const P=Q.panel(qd,{how:H,onPick:(i,v)=>{if(i===0){pick=v;H.done(0,!!v);Q.redraw();}}});
const DAYS=[['2일경',15],['3일경',27],['4일경',39],['5일경',51],['7~8일경',88],['10일경',115],['12일경',140],['15일경',176]];
let k=0,maxK=0,pick='',end=false;
const cv=document.getElementById('cv'),rg=document.getElementById('rg'),ov=document.getElementById('ov');
function set(n){n=Math.max(0,Math.min(7,n));
  if(n>0&&!H.is(0)){Q.toast('①부터 순서대로 해 보자.');rg.value=k;return;}
  if(n>maxK+1){Q.toast('하루씩 차례로 옮겨 보자');n=maxK+1;}
  k=n;maxK=Math.max(maxK,k);rg.value=k;ov.textContent='음력 '+DAYS[k][0];
  if(k===7&&!end){end=true;H.done(1);P.open(1);P.open(2);Q.toast('달이 <b>서쪽 → 동쪽</b>으로 옮겨 갔어요');}
  Q.redraw();}
rg.addEventListener('input',()=>set(+rg.value));
document.getElementById('bp').onclick=()=>set(k-1);document.getElementById('bn').onclick=()=>set(k+1);
function pos(e,w,h,hy){const az=262-e*.93,alt=3+50*Math.sin(e*Math.PI/180);return [w/2+(az-180)/100*w*.47,hy-alt/62*(hy-34)];}
function draw(){const [x,w,h]=Q.fit(cv),hy=h*.84;
  const g=x.createLinearGradient(0,0,0,hy);g.addColorStop(0,'#141A3C');g.addColorStop(.55,'#2B2F63');g.addColorStop(.86,'#6B4A6E');g.addColorStop(1,'#C9735A');
  x.fillStyle=g;x.beginPath();x.roundRect(0,0,w,h,20);x.fill();x.save();x.beginPath();x.roundRect(0,0,w,h,20);x.clip();
  const sx=w*.93,sy=hy+26,gl=x.createRadialGradient(sx,sy,0,sx,sy,w*.42);gl.addColorStop(0,'rgba(255,190,110,.95)');gl.addColorStop(.3,'rgba(255,150,90,.45)');gl.addColorStop(1,'rgba(255,150,90,0)');
  x.fillStyle=gl;x.fillRect(0,0,w,hy);
  Q.stars(x,w,hy*.7,70,11);
  const r=Math.max(15,Math.min(w,h)*.052);
  /* 지나온 날의 달(흐리게) → 오늘의 달 */
  for(let i=0;i<=k;i++){const e=DAYS[i][1],p=pos(e,w,h,hy),rot=Math.atan2(sy-p[1],sx-p[0])*(e<150?1:.25);
    Moon.draw(x,p[0],p[1],r,e,{rot:rot,dark:.1,darkCol:'#232750'});
    if(i<k){x.fillStyle='rgba(43,47,99,.45)';x.beginPath();x.arc(p[0],p[1],r+1,0,7);x.fill();}
    else{x.strokeStyle='#FFB340';x.lineWidth=2.5;x.beginPath();x.arc(p[0],p[1],r+6,0,7);x.stroke();}
    Q.txt(x,DAYS[i][0],p[0],p[1]+r+16,{s:i===k?15:12.5,c:i===k?'#FFB340':'rgba(255,255,255,.7)',w:i===k?900:500,halo:3});}
  if(end){const a=pos(40,w,h,hy),b=pos(150,w,h,hy);Q.arrow(x,a[0],hy-(hy-34)*.97,b[0],hy-(hy-34)*.97,'#FFB340',4,11);Q.txt(x,'서쪽 → 동쪽으로 이동',(a[0]+b[0])/2,hy-(hy-34)*.97+20,{c:'#FFB340',s:15,w:900,halo:3});}
  /* 땅 */
  x.fillStyle='#0B0E18';x.beginPath();x.moveTo(0,h);x.lineTo(0,hy);for(let i=0;i<=60;i++){const xx=w*i/60;x.lineTo(xx,hy-(Math.sin(i*1.7)*.5+.5)*6-(i%9===4?12:0)-(i%13===6?8:0));}x.lineTo(w,h);x.closePath();x.fill();
  [['동',.5-.9*.47],['남',.5],['서',.5+.9*.47]].forEach(d=>Q.txt(x,d[0],w*d[1],hy+(h-hy)/2+3,{s:20,w:900}));
  Q.txt(x,'해가 진 직후',sx-8,hy-12,{s:13,c:'rgba(255,225,190,.95)',a:'right'});
  Q.pill(x,'매일 같은 시각(초저녁)에 본 하늘',w-132,22,{s:13.5});
  if(pick){Q.pill(x,'내가 떠올린 달: '+pick,100,22,{s:13,bg:'rgba(255,255,255,.2)'});}
  x.restore();}
Q.loop(draw);set(0);
})();
</script>
</body>
</html>
