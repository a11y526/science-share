}

}

    var px=Math.min(s.width-1,Math.floor((lon/Math.PI+.5)*s.width)),py=Math.min(s.height-1,Math.floor((.5-lat/Math.PI)*s.height)),q=(py*s.width+px)*4;
    var a=Math.min(1,(1-Math.sqrt(rr))*N*.5),lim=1.25*(.82+.18*Math.sqrt(1-rr));
    o.data[k]=Math.min(255,S[q]*lim);o.data[k+1]=Math.min(255,S[q+1]*lim);o.data[k+2]=Math.min(255,S[q+2]*lim);o.data[k+3]=255*a;}
  x.clearRect(0,0,N,N);x.putImageData(o,0,0);if(window.Q)Q.redraw();}catch(e){}};im.src=window.MOON_NEAR;}
function draw(x,cx,cy,r,e,o){o=o||{};e=((e%360)+360)%360;var k=Math.cos(e*Math.PI/180),wax=e<=180,H=Math.PI/2;
  x.save();x.translate(cx,cy);if(o.rot)x.rotate(o.rot);
  x.beginPath();x.arc(0,0,r,0,7);x.fillStyle=o.darkCol||'#10131F';x.fill();
  x.globalAlpha=o.dark==null?.13:o.dark;x.drawImage(disc,-r,-r,r*2,r*2);x.globalAlpha=1;
  if(e>.8&&e<359.2){x.beginPath();x.arc(0,0,r,-H,H,!wax);
    x.ellipse(0,0,Math.max(.01,r*Math.abs(k)),r,0,H,wax===(k>0)?-H:3*H,wax===(k>0));x.closePath();x.clip();
    x.drawImage(disc,-r,-r,r*2,r*2);}
  x.restore();
  if(o.ring){x.strokeStyle=o.ring;x.lineWidth=o.rw||1.5;x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();}}
/* 우주에서 내려다본 달: 태양 쪽(sunAng 방향) 절반이 항상 밝다 */
function top(x,cx,cy,r,sunAng){x.save();x.translate(cx,cy);x.rotate(sunAng||0);
  x.beginPath();x.arc(0,0,r,0,7);x.fillStyle='#262A38';x.fill();
  x.beginPath();x.arc(0,0,r,-Math.PI/2,Math.PI/2);x.closePath();x.fillStyle='#EDEBE4';x.fill();
  x.restore();}
function name(e){e=((e%360)+360)%360;return e<10||e>350?'삭':e<80?'초승달':e<=100?'상현달':e<170?'상현달과 보름달 사이':e<=190?'망(보름달)':e<260?'보름달과 하현달 사이':e<=280?'하현달':'그믐달';}
return {draw:draw,top:top,name:name,disc:disc};
})();
</script>
</head>
<body>
<p class="how" id="how"></p>
<div class="row">
  <div class="stage">
    <div class="cvbox"><canvas id="cv"></canvas></div>
    <div id="cmpbox" style="flex:none;height:132px;min-height:0;overflow:hidden;display:none"><canvas id="cmp"></canvas></div>
    <div class="ctrl"><button type="button" id="bc">지구에서 본 모습 비교</button><span class="st" id="st">달을 끌어 옮겨 보자</span></div>
  </div>
  <aside id="qs"></aside>
</div>
<script>
(function(){
'use strict';
const H=Q.how(['① <b>달을 끌어</b> 점선 동그라미 네 곳에 모두 놓기','② <b>[지구에서 본 모습 비교]</b>를 누르고 달을 두 곳 이상 옮겨 보기','③ 1~3번을 <b>골라 [제출]</b>']);
const qd=window.QD[3];qd[0].lock=qd[1].lock='① 달을 네 곳에 모두 놓아 보세요';qd[2].lock='② [지구에서 본 모습 비교]를 눌러 보세요';
const P=Q.panel(qd,{how:H});
const cv=document.getElementById('cv'),cmp=document.getElementById('cmp'),bc=document.getElementById('bc'),st=document.getElementById('st');
const SPOT=[0,90,180,270],SN=['태양 쪽','위쪽','태양 반대쪽','아래쪽'];
let e=35,seen=[0,0,0,0],on=false,seen2=[0,0,0,0],G=null,drag=false;
function geo(w,h){const cx=w*.44,cy=h*.5,R=Math.min(w*.3,h*.36),r=Math.max(15,R*.17);return {cx,cy,R,r};}
function mp(a){const t=a*Math.PI/180;return [G.cx+G.R*Math.cos(t),G.cy-G.R*Math.sin(t)];}
function near(){let b=-1;SPOT.forEach((s,i)=>{if(Math.abs(Q.dAng(e,s))<16)b=i;});return b;}
function land(){const b=near();if(b<0)return;e=SPOT[b];
  if(!seen[b]){seen[b]=1;const n=seen.reduce((a,c)=>a+c);if(n===4){H.done(0);P.open(0);P.open(1);Q.toast('어느 위치에서나 달은 <b>태양 쪽 절반</b>이 밝아요');}else Q.toast(SN[b]+' ('+n+' / 4)');}
  if(on&&!seen2[b]){seen2[b]=1;if(seen2.reduce((a,c)=>a+c)>=2&&!H.is(1)){H.done(1);P.open(2);Q.toast('지구에서 <b>보이는 넓이</b>가 달라졌어요');}}
  Q.redraw();}
function at(ev){const r=cv.getBoundingClientRect();return [ev.clientX-r.left,ev.clientY-r.top];}
cv.addEventListener('pointerdown',ev=>{if(!G)return;const p=at(ev),m=mp(e);if(Math.hypot(p[0]-m[0],p[1]-m[1])>G.r+30){Q.toast('달을 잡고 끌어 보자');return;}drag=true;cv.setPointerCapture(ev.pointerId);ev.preventDefault();});
cv.addEventListener('pointermove',ev=>{const p=at(ev);if(!drag){if(G){const m=mp(e);cv.style.cursor=Math.hypot(p[0]-m[0],p[1]-m[1])<G.r+30?'grab':'default';}return;}
  e=(Math.atan2(G.cy-p[1],p[0]-G.cx)*180/Math.PI+360)%360;Q.redraw();});
function up(){if(!drag)return;drag=false;land();}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
bc.onclick=()=>{if(!H.is(0)){Q.toast('①부터 해 보세요');return;}on=!on;bc.classList.toggle('on',on);document.getElementById('cmpbox').style.display=on?'block':'none';if(on){seen2=[0,0,0,0];const b=near();if(b>=0)seen2[b]=1;}Q.redraw();};
function draw(){const [x,w,h]=Q.fit(cv);G=geo(w,h);
  const g=x.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*.7);g.addColorStop(0,'#1E2747');g.addColorStop(1,'#080B17');x.fillStyle=g;x.beginPath();x.roundRect(0,0,w,h,20);x.fill();
  x.save();x.beginPath();x.roundRect(0,0,w,h,20);x.clip();Q.stars(x,w,h,60,5);
  /* 햇빛: 오른쪽에서 평행하게 */
  for(let i=0;i<5;i++){const y=G.cy+(i-2)*G.R*.52;const gr=x.createLinearGradient(w,0,G.cx+G.R+G.r+30,0);gr.addColorStop(0,'rgba(255,214,90,.95)');gr.addColorStop(1,'rgba(255,214,90,.5)');Q.arrow(x,w-8,y,G.cx+G.R+G.r+34,y,gr,5,10);}
  Q.txt(x,'햇빛',w-34,G.cy-G.R*1.04-22,{c:'#FFD65A',s:16,w:900});
  /* 궤도와 네 자리 */
  x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=1.5;x.beginPath();x.arc(G.cx,G.cy,G.R,0,7);x.stroke();
  Q.arrow(x,G.cx+G.R*Math.cos(.55),G.cy-G.R*Math.sin(.55),G.cx+G.R*Math.cos(.78),G.cy-G.R*Math.sin(.78),'rgba(255,255,255,.7)',2.5,8);
  SPOT.forEach((s,i)=>{const p=mp(s);x.setLineDash([5,5]);x.strokeStyle=seen[i]?'rgba(60,220,150,.9)':'rgba(255,255,255,.65)';x.lineWidth=2;x.beginPath();x.arc(p[0],p[1],G.r+7,0,7);x.stroke();x.setLineDash([]);
    if(seen[i])Q.txt(x,'✓',p[0]+(s===0?G.r+20:s===180?-G.r-20:0),p[1]+(s===90?-G.r-20:s===270?G.r+20:0),{c:'#3CDC96',s:17,w:900});});
  /* 지구 */
  const er=G.R*.2;const eg=x.createLinearGradient(G.cx+er,0,G.cx-er,0);eg.addColorStop(0,'#5FB2F2');eg.addColorStop(.5,'#2C6FC2');eg.addColorStop(.52,'#122A55');eg.addColorStop(1,'#0B1836');
  x.fillStyle=eg;x.beginPath();x.arc(G.cx,G.cy,er,0,7);x.fill();Q.txt(x,'지구',G.cx,G.cy+er+16,{s:15,w:900});
  /* 달 */
  const m=mp(e),t=e*Math.PI/180;
  if(on){const ux=Math.cos(t),uy=-Math.sin(t),px=-uy,py=ux;
    x.fillStyle='rgba(255,255,255,.1)';x.beginPath();x.moveTo(G.cx,G.cy);x.lineTo(m[0]+px*G.r*1.15,m[1]+py*G.r*1.15);x.lineTo(m[0]-px*G.r*1.15,m[1]-py*G.r*1.15);x.closePath();x.fill();
    x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=1.5;x.setLineDash([6,5]);x.beginPath();x.moveTo(G.cx,G.cy);x.lineTo(m[0],m[1]);x.stroke();x.setLineDash([]);}
  Moon.top(x,m[0],m[1],G.r,0);
  if(on){/* 지구 쪽 반쪽(지구에서 보이는 면)에 테두리 */
    x.strokeStyle='#FFB340';x.lineWidth=4;x.beginPath();x.arc(m[0],m[1],G.r+3,-t+Math.PI/2,-t+Math.PI*1.5);x.stroke();
    Q.txt(x,'지구에서 보이는 면',m[0],m[1]+(Math.sin(t)>.3?-G.r-20:G.r+22),{c:'#FFB340',s:14,w:900,halo:3});}
  else Q.txt(x,'달',m[0],m[1]+(Math.sin(t)>.3?-G.r-16:G.r+18),{s:15,w:900,halo:3});
  Q.txt(x,'크기와 거리는 실제와 다르게 그렸다.',12,h-14,{a:'left',s:12,c:'rgba(255,255,255,.5)',w:500});
  x.restore();
  st.textContent=near()>=0?SN[near()]+'에 놓았어요':'달을 끌어 점선 동그라미에 놓아 보자';
  if(on){const [c,cw,ch]=Q.fit(cmp);c.clearRect(0,0,cw,ch);const lit=Math.round((1-Math.cos(t))/2*100);
    [[0,'우주에서 본 달','항상 절반이 밝다'],[1,'지구에서 본 달',Moon.name(e)+' · 밝게 보이는 부분 '+lit+'%']].forEach(a=>{const bx=a[0]*(cw/2+5),bw=cw/2-5;
      c.fillStyle='#0E1326';c.beginPath();c.roundRect(bx,0,bw,ch,18);c.fill();const r=ch*.36;
      if(a[0])Moon.draw(c,bx+r+18,ch/2,r,e,{dark:.16});else Moon.top(c,bx+r+18,ch/2,r,0);
      Q.txt(c,a[1],bx+r*2+34,ch/2-13,{a:'left',s:16,w:900});Q.txt(c,a[2],bx+r*2+34,ch/2+13,{a:'left',s:14,c:'#FFD65A',w:700});});}}
Q.loop(draw);
})();
</script>
