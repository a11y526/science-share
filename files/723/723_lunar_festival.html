<!doctype html>
<html lang="ko">
<head>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:var(--font);word-break:keep-all;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}

button:hover{background:#E6E6E6}

button.on,button.on:hover{background:var(--ink);color:#fff}

.how span{color:var(--dim);font-weight:500}
.how span.now{color:var(--ink);font-weight:700}
.how span.now b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.how span.done{color:var(--ok)}
.how span.done::after{content:" ✓";font-weight:900}
.how span.flash{animation:howflash .8s 3;border-radius:6px}

.row{flex:1;min-height:0;display:flex;gap:12px}
.stage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;position:relative}
.stage canvas{display:block;width:100%;height:100%;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:20px}
.cvbox{flex:1;min-height:0;position:relative}
.ctrl{flex:none;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:15.5px;font-weight:700}
.ctrl input[type=range]{accent-color:var(--ink);flex:1;min-width:160px;height:34px;touch-action:none}
.ctrl output{font-variant-numeric:tabular-nums;min-width:96px;text-align:center}
.ctrl .st{margin-left:auto;font-size:14.5px;color:var(--mut);font-weight:500}
.ctrl .arw{width:42px;padding:0;font-size:18px}

.q{background:var(--box);border-radius:18px;padding:11px 14px;font-size:16px;font-weight:500;line-height:1.75;transition:background .2s}
.q .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:900;margin-right:7px;vertical-align:1px}

.q .opts{display:inline-flex;flex-wrap:wrap;gap:4px;margin:1px 3px;vertical-align:middle;background:#fff;border-radius:999px;padding:3px}
.q .opts button{background:transparent;font-size:15px;min-height:32px;padding:1px 12px;line-height:1.3}
.q .opts button:hover{background:var(--line)}
.q .opts button.on{background:var(--ink);color:#fff}
.q textarea{display:block;width:100%;margin-top:6px;font:500 15.5px var(--font);border:0;border-radius:12px;padding:8px 11px;outline:none;color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1.5px #E3E3E3;resize:none}
.q textarea:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.q .lock{display:none;font-size:14px;font-weight:700;color:var(--mut);line-height:1.5;margin-top:2px}
.q .lock::before{content:"🔒 "}
.q.locked{cursor:pointer}
.q.locked .body{opacity:.45;pointer-events:none}
.q.locked .lock{display:block}
.q .lock.warn{color:#8A3A00;background:#FFF1D6;border-radius:10px;padding:6px 9px}
.q .lock.warn::before{content:""}
.q.locked:has(.lock.warn){box-shadow:inset 0 0 0 2px #F5A524}
.q.nudge{animation:qshake .42s}

.q.bad{box-shadow:inset 0 0 0 2px #E0471A;background:#FFF4F0}

.q.good{box-shadow:inset 0 0 0 2px #22C582}
.sub{flex:none;display:flex;flex-direction:column;gap:5px;margin-top:auto}
.sub button{background:var(--ink);color:#fff;font-size:17px;min-height:46px}
.sub button:hover{background:#2B2B2B}
.sub button:disabled{background:var(--pill);color:var(--dim);opacity:1}
.sub .msg{font-size:14px;font-weight:700;color:var(--mut);text-align:center;min-height:20px}
.sub .msg.ok{color:var(--ok)}.sub .msg.bad{color:#A23B0B}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(13,13,13,.9);color:#fff;font-size:16.5px;font-weight:700;border-radius:16px;padding:8px 18px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:9;width:max-content;max-width:92%;text-align:center;line-height:1.45}
.toast.on{opacity:1}.toast b{color:#FFD65A}
.gohere{animation:gohere .9s 3;position:relative;z-index:4}
.stage.gohere{border-radius:20px}
@keyframes gohere{0%,100%{box-shadow:0 0 0 0 rgba(245,165,36,0)}50%{box-shadow:0 0 0 6px rgba(245,165,36,.85)}}
.cap{position:absolute;font-size:13.5px;font-weight:700;border-radius:999px;padding:4px 11px;background:rgba(255,255,255,.14);color:#fff;pointer-events:none}
@media (max-height:560px) and (min-width:601px){
  body{padding:6px;gap:6px}.how{font-size:14px;padding:5px 12px}
  #qs{gap:5px}.q{padding:6px 11px;font-size:14.5px;line-height:1.6;border-radius:14px}
  .q .opts button{font-size:13.5px;min-height:28px;padding:0 9px}
  .sub button{min-height:38px;font-size:15.5px}.sub .msg{font-size:12.5px;min-height:16px}
  button{min-height:36px;font-size:14.5px}
}
@media (max-width:600px){
  body{overflow:auto;height:auto;min-height:100%}
  .row{flex-direction:column}.stage{flex:none;height:64vh;min-height:320px}
  #qs{flex:none;overflow:visible}
}
@media (prefers-reduced-motion:reduce){.q.nudge,.how span.flash,.gohere{animation:none}}
</style>

  var x=disc.getContext('2d'),o=x.createImageData(N,N),R=N/2;
  for(var j=0;j<N;j++)for(var i=0;i<N;i++){var u=(i+.5-R)/R,v=(j+.5-R)/R,rr=u*u+v*v,k=(j*N+i)*4;if(rr>1)continue;
    var lat=Math.asin(-v),lon=Math.asin(Math.max(-1,Math.min(1,u/Math.cos(lat))));
    var px=Math.min(s.width-1,Math.floor((lon/Math.PI+.5)*s.width)),py=Math.min(s.height-1,Math.floor((.5-lat/Math.PI)*s.height)),q=(py*s.width+px)*4;
    var a=Math.min(1,(1-Math.sqrt(rr))*N*.5),lim=1.25*(.82+.18*Math.sqrt(1-rr));
    o.data[k]=Math.min(255,S[q]*lim);o.data[k+1]=Math.min(255,S[q+1]*lim);o.data[k+2]=Math.min(255,S[q+2]*lim);o.data[k+3]=255*a;}
  x.clearRect(0,0,N,N);x.putImageData(o,0,0);if(window.Q)Q.redraw();}catch(e){}};im.src=window.MOON_NEAR;}
function draw(x,cx,cy,r,e,o){o=o||{};e=((e%360)+360)%360;var k=Math.cos(e*Math.PI/180),wax=e<=180,H=Math.PI/2;
  x.save();x.translate(cx,cy);if(o.rot)x.rotate(o.rot);
  x.beginPath();x.arc(0,0,r,0,7);x.fillStyle=o.darkCol||'#10131F';x.fill();
  x.globalAlpha=o.dark==null?.13:o.dark;x.drawImage(disc,-r,-r,r*2,r*2);x.globalAlpha=1;
  if(e>.8&&e<359.2){x.beginPath();x.arc(0,0,r,-H,H,!wax);
    x.ellipse(0,0,Math.max(.01,r*Math.abs(k)),r,0,H,wax===(k>0)?-H:3*H,wax===(k>0));x.closePath();x.clip();
    x.drawImage(disc,-r,-r,r*2,r*2);}
  x.restore();
  if(o.ring){x.strokeStyle=o.ring;x.lineWidth=o.rw||1.5;x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();}}
/* 우주에서 내려다본 달: 태양 쪽(sunAng 방향) 절반이 항상 밝다 */
function top(x,cx,cy,r,sunAng){x.save();x.translate(cx,cy);x.rotate(sunAng||0);
  x.beginPath();x.arc(0,0,r,0,7);x.fillStyle='#262A38';x.fill();
  x.beginPath();x.arc(0,0,r,-Math.PI/2,Math.PI/2);x.closePath();x.fillStyle='#EDEBE4';x.fill();
  x.restore();}
function name(e){e=((e%360)+360)%360;return e<10||e>350?'삭':e<80?'초승달':e<=100?'상현달':e<170?'상현달과 보름달 사이':e<=190?'망(보름달)':e<260?'보름달과 하현달 사이':e<=280?'하현달':'그믐달';}
return {draw:draw,top:top,name:name,disc:disc};
})();
</script>
</head>
<body>
<style>
#cards{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#cards button{border-radius:18px;min-height:56px;padding:6px 10px;line-height:1.3;font-size:15.5px}
#cards button small{display:block;font-size:12.5px;font-weight:500;opacity:.75}
#cards button.fin:not(.on){background:rgba(34,197,130,.14);color:#0F8A5F}
#ph{flex:none;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#ph span{font-size:14.5px;font-weight:700;color:var(--mut);margin-right:2px}
</style>
<p class="how" id="how"></p>
<div class="row">
  <div class="stage">
    <div id="cards"></div>
    <div class="cvbox"><canvas id="cv"></canvas></div>
    <div id="ph"><span>그날 달의 위상</span></div>
  </div>
  <aside id="qs"></aside>
</div>
<script>
(function(){
'use strict';
const NM=['가','나','다','라','마','바','사','아'];
const H=Q.how(['① <b>날짜 카드</b>를 누르고, 궤도에서 그날 <b>달의 위치</b> 누르기','② 그날 <b>달의 위상</b> 고르기 (카드 세 장 모두)','③ 1~3번을 <b>골라 [제출]</b>']);
const qd=window.QD[8];qd[0].lock='①② 설날 카드를 완성해 보세요';qd[1].lock='①② 정월 대보름·추석 카드를 완성해 보세요';qd[2].lock='①② 음력 7~8일경 카드를 완성해 보세요';
const P=Q.panel(qd,{how:H});
const C=[{t:'설날',s:'음력 1월 1일',pos:0,ph:'삭',hint:'음력 1일에는 달이 태양과 같은 방향에 있다.'},
  {t:'정월 대보름 · 추석',s:'음력 1월 15일 · 음력 8월 15일',pos:4,ph:'망(보름달)',hint:'음력 15일에는 달이 태양과 반대 방향에 있다.'},
  {t:'음력 7~8일경',s:'태양·지구·달이 직각',pos:2,ph:'상현달',hint:'삭에서 시계 반대 방향으로 반의 반 바퀴 돌았다.'}];
C.forEach(c=>{c.st=0;c.e=0;});
let cur=-1,G=null;
const cv=document.getElementById('cv'),cards=document.getElementById('cards'),ph=document.getElementById('ph');
const CB=C.map((c,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=c.t+'<small>'+c.s+'</small>';b.onclick=()=>{cur=i;sync();};cards.appendChild(b);return b;});
const PB=['삭','상현달','망(보름달)','하현달'].map(n=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.onclick=()=>pickPh(n);ph.appendChild(b);return b;});
function sync(){CB.forEach((b,i)=>{b.classList.toggle('on',i===cur);b.classList.toggle('fin',C[i].st===2);});
  const c=C[cur];PB.forEach(b=>{b.disabled=!c||c.st!==1;b.classList.toggle('on',!!c&&c.st===2&&b.textContent===c.ph);});Q.redraw();}
function pickPh(n){const c=C[cur];if(!c||c.st!==1)return;if(n!==c.ph){Q.toast('궤도에서 달의 밝은 면이 지구 쪽으로 얼마나 보이는지 살펴보자');return;}
  c.st=2;P.open(cur);const d=C.filter(k=>k.st===2).length;Q.tell({type:'sim:progress',n:d,total:3});
  if(d===3){H.done(0);H.done(1);Q.toast('세 날짜의 달을 모두 찾았어요');}else Q.toast(c.t+': <b>'+c.ph+'</b> · 다음 카드를 눌러 보자');sync();}
function mp(a,k){const t=a*Math.PI/180,R=G.R*(k||1);return [G.cx+R*Math.cos(t),G.cy-R*Math.sin(t)];}
cv.addEventListener('click',ev=>{if(!G)return;const r=cv.getBoundingClientRect(),px=ev.clientX-r.left,py=ev.clientY-r.top;
  let hit=-1;for(let i=0;i<8;i++){const p=mp(i*45);if(Math.hypot(px-p[0],py-p[1])<G.r+16)hit=i;}if(hit<0)return;
  if(cur<0){Q.toast('<b>날짜 카드</b>를 먼저 눌러 보자');return;}const c=C[cur];if(c.st!==0)return;
  if(hit!==c.pos){Q.toast(c.hint);return;}
  c.st=.5;const t0=performance.now(),dur=c.pos*260+300;(function f(){const k=Math.min(1,(performance.now()-t0)/dur),s=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;c.e=c.pos*45*s;Q.redraw();
    if(k<1)requestAnimationFrame(f);else{c.st=1;Q.toast('('+NM[c.pos]+') 위치 · 이제 <b>달의 위상</b>을 골라 보자');sync();}})();});
function draw(){const [x,w,h]=Q.fit(cv),lw=w*.6;const R=Math.min(lw*.3,h*.32);G={cx:lw*.45,cy:h*.5,R:R,r:Math.max(13,R*.17)};
  const g=x.createRadialGradient(lw/2,h/2,0,lw/2,h/2,w*.7);g.addColorStop(0,'#1E2747');g.addColorStop(1,'#080B17');x.fillStyle=g;x.beginPath();x.roundRect(0,0,w,h,20);x.fill();
  x.save();x.beginPath();x.roundRect(0,0,w,h,20);x.clip();
  const c=C[cur];
  for(let i=0;i<3;i++){const y=G.cy+(i-1)*R*.7;Q.arrow(x,lw-6,y,G.cx+R+G.r+30,y,'rgba(255,214,90,.8)',4.5,9);}
  Q.txt(x,'햇빛',lw-26,G.cy-R*.7-18,{c:'#FFD65A',s:15,w:900});
  x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=1.5;x.beginPath();x.arc(G.cx,G.cy,R,0,7);x.stroke();
  const er=R*.2,eg=x.createLinearGradient(G.cx+er,0,G.cx-er,0);eg.addColorStop(0,'#5FB2F2');eg.addColorStop(.5,'#2C6FC2');eg.addColorStop(.52,'#122A55');eg.addColorStop(1,'#0B1836');
  x.fillStyle=eg;x.beginPath();x.arc(G.cx,G.cy,er,0,7);x.fill();Q.txt(x,'지구',G.cx,G.cy+er+15,{s:14,w:900});
  for(let i=0;i<8;i++){const p=mp(i*45),l=mp(i*45,1.36),ask=c&&c.st===0;
    x.globalAlpha=.42;Moon.top(x,p[0],p[1],G.r*.8,0);x.globalAlpha=1;
    if(ask){x.setLineDash([4,4]);x.strokeStyle='#fff';x.lineWidth=1.8;x.beginPath();x.arc(p[0],p[1],G.r+5,0,7);x.stroke();x.setLineDash([]);}
    Q.txt(x,'('+NM[i]+')',l[0],l[1],{s:14.5,w:900,halo:3});}
  if(c&&c.st>0){const m=mp(c.e);Moon.top(x,m[0],m[1],G.r,0);x.strokeStyle='#FFB340';x.lineWidth=3;x.beginPath();x.arc(m[0],m[1],G.r+5,0,7);x.stroke();}
  if(!c)Q.pill(x,'위의 날짜 카드를 눌러 보자',G.cx,22,{s:14});
  else if(c.st===0)Q.pill(x,c.t+'에 달은 어디에 있을까? (가)~(아) 가운데 누르기',lw/2,22,{s:14,bg:'#FFB340',c:'#0D0D0D',w:900});
  /* 그날 밤하늘 */
  const sx=lw+6,sw=w-lw-18,sy=12,sh=h-24;
  x.save();x.beginPath();x.roundRect(sx,sy,sw,sh,18);x.clip();const sg=x.createLinearGradient(0,sy,0,sy+sh);sg.addColorStop(0,'#05070F');sg.addColorStop(1,'#1A2146');x.fillStyle=sg;x.fillRect(sx,sy,sw,sh);
  x.save();x.translate(sx,sy);Q.stars(x,sw,sh*.8,46,3);x.restore();
  if(c&&c.st===2){const mr=Math.min(sw,sh)*.2,mx=sx+sw/2,my=sy+sh*.38;
    if(c.pos===0){x.setLineDash([5,6]);x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=1.5;x.beginPath();x.arc(mx,my,mr,0,7);x.stroke();x.setLineDash([]);Q.txt(x,'달이 보이지 않는다',mx,my,{s:15,c:'rgba(255,255,255,.8)'});}
    else{if(c.pos===4){const gw=x.createRadialGradient(mx,my,mr*.8,mx,my,mr*2.6);gw.addColorStop(0,'rgba(255,240,200,.35)');gw.addColorStop(1,'rgba(255,240,200,0)');x.fillStyle=gw;x.fillRect(sx,sy,sw,sh);}
      Moon.draw(x,mx,my,mr,c.pos*45,{dark:.16});}
    Q.txt(x,c.ph,mx,my+mr+24,{s:19,w:900,c:'#FFD65A'});}
  else Q.txt(x,'?',sx+sw/2,sy+sh*.4,{s:44,c:'rgba(255,255,255,.3)',w:900});
  x.fillStyle='#04060C';x.beginPath();x.moveTo(sx,sy+sh);x.lineTo(sx,sy+sh*.86);
  for(let i=0;i<=30;i++){const xx=sx+sw*i/30;x.lineTo(xx,sy+sh*.86-(Math.sin(i*.9)*.5+.5)*sh*.035-(i>8&&i<16?sh*.05*Math.sin((i-8)/8*Math.PI):0));}x.lineTo(sx+sw,sy+sh);x.closePath();x.fill();
  Q.txt(x,c?c.t+' 밤하늘':'그날 밤하늘',sx+sw/2,sy+sh-16,{s:14,w:900});x.restore();
  x.restore();}
Q.loop(draw);sync();
})();
</script>
