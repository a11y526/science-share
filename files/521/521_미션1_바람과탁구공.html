<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미션 1 · 바람으로 탁구공 움직이기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#0066CC; --accent-soft:#E8F1FB; --ink:#1D1D1F; --ink2:#515154; --ink3:#86868B;
  --line:#E5E5EA; --bg:#F5F5F7; --card:#FFFFFF; --green:#1E9E4A; --green-soft:#E7F6EC; --orange:#FF9500;
  --font:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;word-break:keep-all}
.app{height:100%;display:flex;flex-direction:column;padding:14px 18px;gap:12px;min-height:470px}
.head{display:flex;align-items:center;gap:12px;flex:none}
.badge{background:var(--accent);color:#fff;font-weight:800;font-size:16px;padding:5px 14px;border-radius:999px;white-space:nowrap}
.head h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.02em}
.head .tag{margin-left:auto;color:var(--ink3);font-size:14px;font-weight:600;white-space:nowrap}
.main{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr;gap:14px}
.side{display:flex;flex-direction:column;gap:10px;min-height:0}
.mis{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:center;touch-action:manipulation;position:relative}
.mis .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--line);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.mis .t{font-size:17px;font-weight:800;line-height:1.4}
.mis .r{font-size:14px;color:var(--ink3);font-weight:600;margin-top:2px;min-height:18px}
.mis.on{border-color:var(--accent)}
.mis.on .n{background:var(--accent)}
.mis.done{border-color:var(--green);background:var(--green-soft)}
.mis.done .n{background:var(--green)}
.mis.done .r{color:var(--green)}
.msg{background:var(--card);border-radius:16px;padding:14px;font-size:16px;line-height:1.6;font-weight:600;color:var(--ink2);flex:1;min-height:70px}
.msg.good{color:var(--green)}
.msg b{color:var(--ink)}
.right{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.stage{flex:1;min-height:200px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative}
.stage svg{display:block;width:100%;height:100%}
.banner{position:absolute;left:50%;top:18px;transform:translateX(-50%) scale(.9);background:var(--green);color:#fff;font-size:22px;font-weight:800;padding:10px 26px;border-radius:999px;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.banner.on{opacity:1;transform:translateX(-50%) scale(1)}
.ctrl{display:flex;gap:12px;align-items:stretch;flex:none;flex-wrap:wrap}
.compass{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px;background:var(--card);border-radius:16px;padding:8px;flex:none}
.compass button{border:1.5px solid var(--line);background:#fff;border-radius:12px;font:800 22px var(--font);color:var(--ink);cursor:pointer;touch-action:manipulation;padding:0}
.compass button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.compass .mid{display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink3);text-align:center;line-height:1.2}
.compass .mid i{display:block;width:16px;height:16px;border-radius:50%;background:var(--orange);margin:0 auto 2px}
.cbox{display:flex;flex-direction:column;gap:8px;justify-content:center;flex:1;min-width:260px}
.clab{font-size:14px;font-weight:700;color:var(--ink3)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--line);background:#fff;font:700 17px var(--font);color:var(--ink);padding:8px 20px;border-radius:999px;min-height:48px;cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;min-width:120px}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;font:700 15px var(--font);color:var(--ink2);padding:8px 14px;border-radius:999px;min-height:40px;cursor:pointer;touch-action:manipulation}
.seg button.on{background:var(--ink);color:#fff}
.seg.rate button.on{background:var(--accent)}
.ro{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;flex:none}
.ro>div{background:var(--card);border-radius:14px;padding:8px 14px}
.ro small{display:block;font-size:13px;color:var(--ink3);font-weight:700}
.ro b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--bg);border-radius:4px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .stage{height:46vh}
}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <span class="badge">미션 1</span>
    <h1>바람으로 탁구공 움직이기</h1>
    <span class="tag">Ⅴ. 힘의 작용 · 물체에 작용하는 힘과 운동</span>
  </div>
  <div class="main">
    <div class="side">
      <div class="mis on" data-m="0"><span class="n">1</span><div><div class="t">탁구공을 더 빠르게 만들어라</div><div class="r"></div></div></div>
      <div class="mis" data-m="1"><span class="n">2</span><div><div class="t">탁구공을 멈췄다가 되돌아가게 만들어라</div><div class="r"></div></div></div>
      <div class="mis" data-m="2"><span class="n">3</span><div><div class="t">탁구공이 휘어져 나아가게 만들어라</div><div class="r"></div></div></div>
      <div class="msg" id="msg"></div>
    </div>
    <div class="right">
      <div class="stage"><svg id="svg" viewBox="0 0 1000 470" preserveAspectRatio="xMidYMid meet"></svg><div class="banner" id="banner"></div></div>
      <div class="ro">
        <div><small>현재 속력</small><b id="vSpeed">40</b><div class="bar"><i id="vBar"></i></div></div>
        <div><small>속력 변화</small><b id="vDs">-</b></div>
        <div><small>운동 방향 변화</small><b id="vDd">-</b></div>
      </div>
      <div class="ctrl">
        <div class="compass" id="compass">
          <button data-a="225">↖</button><button data-a="270">↑</button><button data-a="315">↗</button>
          <button data-a="180">←</button><div class="mid"><i></i>공</div><button data-a="0">→</button>
          <button data-a="135">↙</button><button data-a="90">↓</button><button data-a="45">↘</button>
        </div>
        <div class="cbox">
          <div class="clab">바람이 부는 방향을 고르고 재생을 누르세요.</div>
          <div class="row">
            <button class="btn primary" id="play">재생</button>
            <button class="btn" id="reset">처음으로</button>
          </div>
          <div class="row">
            <div class="seg rate" id="rate"><button data-v="0.35" class="on">느리게</button><button data-v="0.7">보통</button><button data-v="1.4">빠르게</button></div>
            <div class="seg" id="mode"><button data-v="1" class="on">실제</button><button data-v="0">이상</button></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
var NS='http://www.w3.org/2000/svg';
var svg=document.getElementById('svg');
var W=1000,H=470;
var START=40, WIND=115, REACH=500, CORE=0.6, HALF=15, DRAG=0.38, FRIC=10, FMAG=26;
var FAN_D=150, FAN_R=20, BR=14, TABLE=330;
var DZ={x0:240,x1:760,y0:110,y1:360};
var INIT={x:420,y:235};
var DIRNAME={0:'→',45:'↘',90:'↓',135:'↙',180:'←',225:'↖',270:'↑',315:'↗'};

var real=true, rate=0.35, angle=null, running=false, raf=null, lastT=null;
var st, trail, cam, fan, simT, track, ended;
var mission=0, done=[null,null,null];

// ---------- 그리기 요소 ----------
function el(t,a,p){ var e=document.createElementNS(NS,t); for(var k in a) e.setAttribute(k,a[k]); (p||svg).appendChild(e); return e; }
svg.innerHTML='<defs>'+
 '<marker id="mB" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="16" refX="10" refY="8" orient="auto"><path d="M0,0 L20,8 L0,16 Z" fill="#0066CC"/></marker>'+
 '<marker id="mK" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="16" refX="10" refY="8" orient="auto"><path d="M0,0 L20,8 L0,16 Z" fill="#FF3B30"/></marker>'+
 '<linearGradient id="gW" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0066CC" stop-opacity="0.22"/><stop offset="0.6" stop-color="#0066CC" stop-opacity="0.10"/><stop offset="1" stop-color="#0066CC" stop-opacity="0"/></linearGradient></defs>';
var gTable=el('g',{}), gFan=el('g',{}), gTrail=el('g',{}), gVel=el('g',{}), gF=el('g',{});
var ball=el('circle',{r:BR,fill:'#FF9500',stroke:'#fff','stroke-width':2});
var legend=el('g',{transform:'translate(16,'+(H-16)+')'});
legend.innerHTML='<circle cx="7" cy="-5" r="7" fill="#FF9500"/><text x="20" y="0" font-size="16" fill="#6E6E73">탁구공</text>'+
 '<line x1="86" y1="-5" x2="114" y2="-5" stroke="#0066CC" stroke-width="4"/><text x="122" y="0" font-size="16" fill="#6E6E73">운동 방향</text>'+
 '<line x1="210" y1="-5" x2="238" y2="-5" stroke="#FF3B30" stroke-width="4"/><text x="246" y="0" font-size="16" fill="#6E6E73">공에 작용하는 힘</text>'+
 '<rect x="382" y="-13" width="28" height="16" fill="#0066CC" fill-opacity="0.18"/><text x="418" y="0" font-size="16" fill="#6E6E73">바람이 닿는 범위</text>';
var stat=el('text',{x:W-18,y:30,'text-anchor':'end','font-size':18,'font-weight':700,fill:'#86868B'});
[legend,stat].forEach(function(e){ e.setAttribute('font-family',"Noto Sans KR, Noto Sans CJK KR, sans-serif"); });

function rad(d){ return d*Math.PI/180; }
function windAt(px,py){
  if(angle===null) return [0,0,0];
  var wx=Math.cos(rad(angle)), wy=Math.sin(rad(angle));
  var dx=px-fan.x, dy=py-fan.y, s=dx*wx+dy*wy;
  if(s<=0) return [0,0,0];
  var r=Math.abs(-dx*wy+dy*wx);
  var fa=s<CORE*REACH?1:Math.max(0,(1-s/REACH)/(1-CORE));
  var rc=FAN_R+s*Math.tan(rad(HALF));
  var fr=Math.max(0,1-(r/rc)*(r/rc));
  var m=WIND*fa*fr; return [m*wx,m*wy,m];
}
function accel(){
  if(angle===null) return [0,0,0];
  if(real){
    var w=windAt(st.x,st.y), ax=DRAG*(w[0]-st.vx), ay=DRAG*(w[1]-st.vy), sp=Math.hypot(st.vx,st.vy);
    if(sp>0.4){ ax-=FRIC*st.vx/sp; ay-=FRIC*st.vy/sp; }
    return [ax,ay,w[2]];
  }
  return [FMAG*Math.cos(rad(angle)),FMAG*Math.sin(rad(angle)),WIND];
}
function reset(){
  if(raf) cancelAnimationFrame(raf);
  st={x:140,y:210,vx:START,vy:0,h:0};
  trail=[{x:st.x,y:st.y}]; cam={x:st.x-INIT.x,y:st.y-INIT.y};
  simT=0; running=false; lastT=null; ended=false;
  track={max:START,maxDev:0,rev:false,minSp:START};
  placeFan();
  document.getElementById('play').textContent='재생';
  setRO(true);
  render(true);
}
function placeFan(){
  if(angle===null){ fan=null; return; }
  fan={x:st.x-FAN_D*Math.cos(rad(angle)), y:st.y-FAN_D*Math.sin(rad(angle))};
}
function step(dt){
  if(real){
    var w=windAt(st.x,st.y);
    st.vx+=DRAG*(w[0]-st.vx)*dt; st.vy+=DRAG*(w[1]-st.vy)*dt;
    var sp0=Math.hypot(st.vx,st.vy);
    if(sp0>0){ var dv=FRIC*dt; if(dv>=sp0 && w[2]<1){ st.vx=0; st.vy=0; } else if(dv<sp0){ st.vx-=dv*st.vx/sp0; st.vy-=dv*st.vy/sp0; } }
  } else {
    var a=accel(); st.vx+=a[0]*dt; st.vy+=a[1]*dt;
  }
  var sp=Math.hypot(st.vx,st.vy);
  if(sp>0.5) st.h=Math.atan2(st.vy,st.vx);
  st.x+=st.vx*dt; st.y+=st.vy*dt; simT+=dt;
  trail.push({x:st.x,y:st.y}); if(trail.length>400) trail.shift();
  // 기록
  var dev=devNow();
  if(sp>3){
    if(dev>170) track.rev=true;
    if(!track.rev) track.maxDev=Math.max(track.maxDev,dev);
  }
  track.max=Math.max(track.max,sp); track.minSp=Math.min(track.minSp,sp);
  check(sp,dev);
  if((real && sp<0.5 && simT>0.5 && windAt(st.x,st.y)[2]<1) || simT>11){ finish(); }
}
function devNow(){ return Math.abs(((st.h*180/Math.PI)+540)%360-180); }

function arrow(g,x,y,dx,dy,col,mk){
  if(Math.hypot(dx,dy)<3) return;
  el('line',{x1:x,y1:y,x2:x+dx,y2:y+dy,stroke:'#fff','stroke-width':9},g);
  el('line',{x1:x,y1:y,x2:x+dx,y2:y+dy,stroke:col,'stroke-width':4.5,'marker-end':'url(#'+mk+')'},g);
}
function perp(dx,dy,a){ var L=Math.hypot(dx,dy); if(L<1e-3) return [0,0]; return [-dy/L*a,dx/L*a]; }
function drawFan(ox,oy){
  gFan.innerHTML='';
  if(!fan) return;
  var fx=fan.x-ox, fy=fan.y-oy;
  if(real){
    var tip=FAN_R+REACH*Math.tan(rad(HALF));
    var cg=el('g',{transform:'translate('+fx+' '+fy+') rotate('+angle+')'},gFan);
    el('polygon',{points:FAN_R+','+(-FAN_R*0.8)+' '+REACH+','+(-tip)+' '+REACH+','+tip+' '+FAN_R+','+(FAN_R*0.8),fill:'url(#gW)'},cg);
  } else {
    var r=rad(angle), bx=st.x-ox, by=st.y-oy;
    el('line',{x1:fx+(FAN_R+4)*Math.cos(r),y1:fy+(FAN_R+4)*Math.sin(r),x2:bx-18*Math.cos(r),y2:by-18*Math.sin(r),stroke:'#B9D4F0','stroke-width':3,'stroke-dasharray':'5 5'},gFan);
  }
  var g=el('g',{transform:'rotate('+angle+' '+fx+' '+fy+')'},gFan);
  el('circle',{cx:fx,cy:fy,r:FAN_R,fill:'#FAFAFC',stroke:'#1D1D1F','stroke-width':3},g);
  [0,120,240].forEach(function(a){ var b=rad(a), px=fx+FAN_R*0.7*Math.cos(b), py=fy+FAN_R*0.7*Math.sin(b);
    el('ellipse',{cx:px,cy:py,rx:FAN_R*0.6,ry:FAN_R*0.3,transform:'rotate('+a+' '+px+' '+py+')',fill:'#1D1D1F'},g); });
  var above=(fy-FAN_R-26)>12, t=el('text',{x:fx,y:above?fy-FAN_R-10:fy+FAN_R+24,'text-anchor':'middle','font-size':16,fill:'#6E6E73','font-family':'Noto Sans KR, Noto Sans CJK KR, sans-serif'},gFan);
  t.textContent='선풍기';
}
var uiLast=0;
function render(force){
  var sx=st.x-cam.x, sy=st.y-cam.y;
  if(sx<DZ.x0) cam.x-=DZ.x0-sx; else if(sx>DZ.x1) cam.x+=sx-DZ.x1;
  if(sy<DZ.y0) cam.y-=DZ.y0-sy; else if(sy>DZ.y1) cam.y+=sy-DZ.y1;
  var ox=cam.x, oy=cam.y, bx=st.x-ox, by=st.y-oy;
  
  drawFan(ox,oy);
  gTrail.innerHTML='';
  if(trail.length>1) el('path',{d:'M '+trail.map(function(p){return (p.x-ox).toFixed(1)+' '+(p.y-oy).toFixed(1);}).join(' L '),fill:'none',stroke:'#FFD8A8','stroke-width':3},gTrail);
  ball.setAttribute('cx',bx); ball.setAttribute('cy',by);
  gVel.innerHTML=''; gF.innerHTML='';
  var vdx=st.vx*0.9, vdy=st.vy*0.9, vo=perp(vdx,vdy,-8);
  arrow(gVel,bx+vo[0],by+vo[1],vdx,vdy,'#0066CC','mB');
  var a=accel(), am=Math.hypot(a[0],a[1]);
  if(am>0.5){ var fl=real?Math.min(74,am*1.5):46, fdx=fl*a[0]/am, fdy=fl*a[1]/am, fo=perp(fdx,fdy,8); arrow(gF,bx+fo[0],by+fo[1],fdx,fdy,'#FF3B30','mK'); }
  var sp=Math.hypot(st.vx,st.vy);
  document.getElementById('vBar').style.width=Math.min(100,sp/WIND*100)+'%';
  var now=performance.now(); if(!force && now-uiLast<200) return; uiLast=now;
  document.getElementById('vSpeed').textContent=sp.toFixed(0);
  if(running||simT>0){
    var at=sp>0.5?(a[0]*st.vx+a[1]*st.vy)/sp:0;
    document.getElementById('vDs').textContent= sp<0.5?'멈춤':(Math.abs(at)<Math.max(0.06*am,0.35)?'거의 없음':(at>0?'빨라지는 중':'느려지는 중'));
    var d=devNow();
    document.getElementById('vDd').textContent= track.rev?'멈춘 뒤 반대로':(d<3?'거의 없음':'변함 ('+d.toFixed(0)+'°)');
  }
  stat.textContent = angle===null ? '바람 방향을 고르세요' : (real && a[2]<1 && simT>0 ? (sp<0.5?'정지':'바람이 닿지 않음 — 마찰력만 작용') : '');
}
function setRO(clear){ if(clear){ document.getElementById('vDs').textContent='-'; document.getElementById('vDd').textContent='-'; } }

// ---------- 미션 ----------
var MSG=[
  '공은 지금 <b>오른쪽(→)</b>으로 굴러가고 있어요. 바람이 공을 미는 방향을 바꿔 가며 공을 <b>더 빠르게</b> 만들어 보세요. 공이 가는 방향은 그대로여야 해요.',
  '공을 <b>멈추게 했다가 왔던 쪽으로 되돌아가게</b> 만들어 보세요.',
  '공이 곧게 가지 않고 <b>휘어져 나아가게</b> 만들어 보세요. 성공한 뒤 다른 방향도 해 보세요.'
];
var msgEl=document.getElementById('msg');
function say(h,good){ msgEl.innerHTML=h; msgEl.classList.toggle('good',!!good); }
function selectMission(m){
  mission=m;
  document.querySelectorAll('.mis').forEach(function(c,i){ c.classList.toggle('on',i===m); });
  say(done[m]!==null ? '이미 성공한 미션이에요. 다른 바람 방향으로도 해 볼 수 있어요.' : MSG[m]);
}
function win(m){
  if(done[m]!==null) return;
  done[m]=angle;
  var card=document.querySelectorAll('.mis')[m];
  card.classList.add('done');
  card.querySelector('.r').textContent='성공! 바람 방향 '+DIRNAME[angle];
  var b=document.getElementById('banner'); b.textContent='미션 '+(m+1)+' 성공!'; b.classList.add('on');
  setTimeout(function(){ b.classList.remove('on'); },1600);
  var left=done.indexOf(null);
  if(left<0) say('미션 3개를 모두 성공했어요! 학습지 표에 <b>바람 방향</b>, <b>속력 변화</b>, <b>운동 방향 변화</b>를 적으세요.',true);
  else say('미션 '+(m+1)+' 성공! 학습지에 기록하고 <b>미션 '+(left+1)+'</b>로 넘어가세요.',true);
}
function check(sp,dev){
  if(done[0]===null && sp>=60 && track.maxDev<10 && !track.rev) win(0);
  if(done[1]===null && track.rev) win(1);
  if(done[2]===null && track.maxDev>=25 && !track.rev) win(2);
}
function finish(){
  if(ended) return; ended=true;
  running=false; if(raf) cancelAnimationFrame(raf);
  document.getElementById('play').textContent='다시 재생';
  render(true);
  if(done[mission]!==null) return;
  var h='';
  if(mission===0){
    if(track.max>=60 && track.maxDev>=10) h='공이 빨라지긴 했지만 <b>가는 방향도 바뀌었어요.</b> 방향은 그대로 두고 빠르기만 바꿔 보세요.';
    else if(track.max<=START+1) h='공이 빨라지지 않았어요. 다른 방향에서 바람을 불어 보세요.';
    else h='조금 빨라졌지만 더 빨라질 수 있어요. 다른 방향도 해 보세요.';
  } else if(mission===1){
    if(track.minSp<START-5 && !track.rev) h='공이 느려지긴 했지만 <b>되돌아가지는 않았어요.</b> 다른 방향에서 바람을 불어 보세요.';
    else h='공이 되돌아가지 않았어요. 공이 오는 쪽을 생각해 보세요.';
  } else {
    if(track.rev) h='공이 되돌아갔어요. 휘어지게 하려면 다른 방향이 필요해요.';
    else h='공이 곧게만 움직였어요. 다른 방향에서 바람을 불어 보세요.';
  }
  say(h);
}

// ---------- 조작 ----------
function loop(ts){
  if(!running) return;
  if(lastT===null) lastT=ts;
  var dt=Math.min((ts-lastT)/1000,0.05)*rate; lastT=ts;
  var n=Math.ceil(dt/0.01), h=dt/n; for(var i=0;i<n && running;i++){ step(h); }
  render(); if(running) raf=requestAnimationFrame(loop);
}
document.getElementById('play').onclick=function(){
  if(angle===null){ say('먼저 아래 화살표 버튼으로 <b>바람이 부는 방향</b>을 고르세요.'); return; }
  if(running){ running=false; this.textContent='계속'; render(true); return; }
  if(ended){ reset(); }
  running=true; lastT=null; this.textContent='멈춤';
  raf=requestAnimationFrame(loop);
};
document.getElementById('reset').onclick=function(){ reset(); };
document.querySelectorAll('#compass button').forEach(function(b){
  b.onclick=function(){
    angle=parseInt(b.dataset.a,10);
    document.querySelectorAll('#compass button').forEach(function(x){ x.classList.toggle('on',x===b); });
    reset();
  };
});
document.querySelectorAll('.mis').forEach(function(c,i){ c.onclick=function(){ selectMission(i); }; });
document.querySelectorAll('#rate button').forEach(function(b){ b.onclick=function(){ rate=parseFloat(b.dataset.v); document.querySelectorAll('#rate button').forEach(function(x){ x.classList.toggle('on',x===b); }); }; });
document.querySelectorAll('#mode button').forEach(function(b){ b.onclick=function(){ real=b.dataset.v==='1'; document.querySelectorAll('#mode button').forEach(function(x){ x.classList.toggle('on',x===b); }); reset(); }; });
window.addEventListener('message',function(e){ if(e.data==='sim:pause' && running){ running=false; document.getElementById('play').textContent='계속'; } });
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ render(true); });
selectMission(0); reset();
window.__m1={win:function(){return done;},set:function(a){angle=a;reset();},run:function(t){running=true;var k=0;while(running&&k<t/0.01){step(0.01);k++;}running=false;render(true);return {done:done,track:track,simT:simT};},mode:function(r){real=r;reset();}};
})();
</script>
